name: ApexTierTests
version: 2.1.0
main: ru.mcapex.tiertests.ApexTierTests
author: Apex
description: Тир-тесты на дуэлях Alley и тир игрока в чате и таблисте
website: https://mc-apex.ru
load: POSTWORLD
api-version: '1.8'
depend: [Alley]

commands:
  tiertest:
    description: Тир-тесты (тестер - меню заявок; испытуемый - принять приглашение)
    usage: /tiertest [all | join | stop | decline]
    aliases: [tt]
  tier:
    description: Управление тирами
    usage: /tier reload
    permission: apextier.admin

permissions:
  apextier.use:
    description: Проводить тир-тесты
    default: op
  apextier.admin:
    default: op
