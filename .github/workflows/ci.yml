# CI/CD APEX: тесты на каждый пуш и PR, выкладка на прод после пуша в main.
#
# Для выкладки в Settings → Secrets and variables → Actions нужны секреты:
#   DEPLOY_HOST     — адрес сервера (201.51.30.141)
#   DEPLOY_SSH_KEY  — приватный ключ, публичная часть которого есть
#                     в /root/.ssh/authorized_keys на сервере
# Без них джоба deploy пропускается, тесты работают всё равно.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, mbstring, intl, zip
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  frontend:
    name: Frontend · Vitest и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  deploy:
    name: Выкладка на прод
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Проверить секреты
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "Секреты DEPLOY_HOST / DEPLOY_SSH_KEY не заданы — выкладка пропущена"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Выложить
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy root@"$HOST" "
            set -e
            cd /var/www/mc-apex.ru/mc-apex
            git fetch --quiet origin main
            git checkout --quiet -B main $SHA
            bash backend/deploy/deploy.sh
          "

      - name: Проверить сайт
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for path in / /api/site /up; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://mc-apex.ru$path")
            echo "$path → $code"
            [ "$code" = 200 ] || exit 1
          done
