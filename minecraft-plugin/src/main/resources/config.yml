# ============================================================
#  ApexAuth — привязка игроков к сайту mc-apex.ru
# ============================================================
#
#  ВАЖНО: сервер должен работать с online-mode=true.
#  В offline-mode ник и UUID не подтверждаются, и любой игрок
#  сможет назваться чужим ником и войти в чужой аккаунт.
#
# ============================================================

api:
  # Адрес сайта. Только https: пароль уходит по сети.
  # Порт указывается прямо в адресе, если 443 у хостинга закрыт.
  url: "https://mc-apex.ru:8443"

  # Общий секрет. Должен совпадать с MINECRAFT_SERVER_KEY в .env на сайте.
  # Возьми его на сервере командой:
  #   grep MINECRAFT_SERVER_KEY /var/www/mc-apex.ru/mc-apex/backend/.env
  server-key: "CHANGE_ME"

  # Сколько ждать ответа сайта
  timeout-seconds: 10

  # Прокси вида host:port. Оставь пустым, если хостинг не закрывает
  # исходящие наружу. Если закрывает — без прокси связи с сайтом не будет.
  proxy: ""

  # Что делать, если сайт недоступен.
  #   true  — не пускать игроков (безопасно: проверку нельзя обойти, уронив сайт)
  #   false — пускать без проверки (удобно, но небезопасно)
  fail-closed: true

auth:
  # Сколько секунд даётся на привязку или ввод пароля, потом кик
  timeout-seconds: 120

  # Прятать неавторизованных от остальных игроков
  hide-unauthenticated: true

  # Кикать по истечении времени
  kick-on-timeout: true

  # Ставить на спавн при входе: пока игрок не вошёл, он не должен
  # оказаться там, где вышел, — иначе сбежит с зоны входа
  spawn-on-join: true

  # Как часто напоминать о входе, секунд. Напоминание — это сообщение
  # в чат и заголовок на экране, чтобы игрок не стоял в недоумении
  remind-seconds: 10

  # Сколько минут помнить удачный вход. 0 — спрашивать пароль всегда
  session-minutes: 30

  # Пропускать без пароля только с того же IP: зашёл с другого — спросим снова
  session-bind-ip: true

  # Операторы сервера получают все права, включая apexauth.bypass, поэтому
  # по умолчанию они тоже проходят проверку. true — пускать их без пароля
  op-bypass: false

messages:
  prefix: "&8[&6Apex&8] &r"

  claim-prompt: "&eНик &b%nickname%&e не заявлен на сайте. Зайди на &bmc-apex.ru/profile&e и добавь его в разделе Майнкрафт."

  password-prompt: "&eВведи пароль от сайта &bmc-apex.ru&e в чат"

  nickname-claimed: "&7Ник заявлен аккаунтом &b%account%&7."

  welcome: "&aВход выполнен. Добро пожаловать, &b%player%&a!"

  wrong-password: "&cНеверный пароль. Осталось попыток: &e%attempts%"

  throttled: "&cСлишком много попыток. Подожди %seconds% секунд."

  attempts-used-up: "&cПопытки исчерпаны. Зайди позже."

  timeout-kick: "&cВремя на вход истекло. Зайди снова."

  site-down-kick: "&cСайт недоступен, вход невозможен. Попробуй позже."
