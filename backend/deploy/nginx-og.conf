# Превью ссылок (Open Graph) для Discord, Telegram, VK и других ботов.
#
# SPA отдаёт пустой index.html, а боты не выполняют JavaScript. Этот
# фрагмент отправляет их запросы /user/* и /clan/* в Laravel (/og/...),
# который отдаёт HTML с og-тегами и картинку-карточку. Живые пользователи
# по-прежнему получают SPA.
#
# Подключение: положить в /etc/nginx/snippets/apex-og.conf и внутри
# server { ... } сайта добавить строку `include snippets/apex-og.conf;`
# ВЫШЕ общего `location / { try_files ... /index.html; }`.
# Адрес бэкенда (127.0.0.1:8000) поменять на свой upstream / php-fpm.

set $apex_og_bot 0;
if ($http_user_agent ~* "(Discordbot|TelegramBot|Twitterbot|facebookexternalhit|Slackbot|vkShare|WhatsApp|SkypeUriPreview|LinkedInBot|redditbot)") {
    set $apex_og_bot 1;
}

location ~ ^/(user|clan)/([^/]+)/?$ {
    if ($apex_og_bot = 1) {
        rewrite ^/(user|clan)/([^/]+)/?$ /og/$1/$2 break;
        proxy_pass http://127.0.0.1:8000;
    }

    try_files $uri /index.html;
}

# Картинки превью отдаёт Laravel
location ^~ /og/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
