# Превью ссылок (Open Graph) для Discord, Telegram, VK и других ботов.
#
# SPA отдаёт пустой index.html, а боты не выполняют JavaScript. Этот
# фрагмент отправляет их запросы /user/* и /clan/* в Laravel (/og/...),
# который отдаёт HTML с og-тегами и картинку-карточку. Живые пользователи
# по-прежнему получают SPA.
#
# Подключение: /etc/nginx/snippets/apex-og.conf, а в server { ... } сайта —
# `include snippets/apex-og.conf;` ВЫШЕ общего `location / { ... }`.
# Пути ниже — как на проде (php-fpm 8.4, /var/www/mc-apex.ru/mc-apex).

location ~ ^/(user|clan)/[^/]+/?$ {
    if ($http_user_agent ~* "(Discordbot|TelegramBot|Twitterbot|facebookexternalhit|Slackbot|vkShare|WhatsApp|SkypeUriPreview|LinkedInBot|redditbot)") {
        rewrite ^/(user|clan)/([^/]+)/?$ /og/$1/$2 last;
    }

    root /var/www/mc-apex.ru/mc-apex/frontend/dist;
    try_files $uri /index.html;
}

location ^~ /og/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/mc-apex.ru/mc-apex/backend/public/index.php;
    # После rewrite Laravel должен видеть /og/..., а не исходный /user/...
    fastcgi_param REQUEST_URI $uri$is_args$args;
}
